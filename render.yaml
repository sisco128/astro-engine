# Render Blueprint — astro-engine
#
# Docker, not a native Node build: the image bakes in the Swiss Ephemeris
# files and pins their SHA-256, and the runtime forks persistent workers. Both
# are why this service is a container and not a function. See the Dockerfile.
#
# Apply with: render blueprint launch   (or New → Blueprint in the dashboard)

services:
  - type: web
    name: astro-engine
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt
    # Not free: a free instance sleeps after fifteen minutes, and waking this
    # one means starting the worker pool and re-reading the ephemeris before
    # the first answer. A frontend that occasionally waits forty seconds for
    # the horizon is a frontend nobody trusts.
    plan: starter
    healthCheckPath: /v1/ready
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info

      # The two invariants that must never be relaxed in a deployed service.
      # Without them the library silently falls back to its built-in Moshier
      # approximation when a file is missing — same shape of answer, quietly
      # wrong, and nobody finds out.
      - key: SE_STRICT_EPHEMERIS
        value: 'true'
      - key: SE_FORBID_FALLBACK
        value: 'true'
      - key: SE_EPHE_PATH
        value: /app/ephem

      # Matches what the Dockerfile installed. Reported by /v1/ready, so it is
      # a claim about the image and changing it here changes the claim, not the
      # data on disk.
      - key: EPHEMERIS_PROFILE
        value: full

      # Explicit, because the number this used to derive was the wrong number.
      # `0` meant "one per core", and `availableParallelism()` inside a
      # container counts the HOST's cores — so a starter instance with half a
      # CPU forked four workers, each holding its own ephemeris, and the kernel
      # killed them under load: `Worker exited with code null`, a signal rather
      # than a crash. Sixteen requests in, two answers out.
      #
      # Two, because the pool exists for isolation rather than throughput, and
      # because two Node processes plus the parent are what 512 MB actually
      # holds. The code now derives the same bound from memory when this is
      # unset, so a deployment that forgets it is no longer dangerous.
      - key: POOL_SIZE
        value: '2'
      - key: POOL_TASK_TIMEOUT_MS
        value: '60000'

      - key: CACHE_MAX_ITEMS
        value: '500'
      # 64 MB, not 256. A quarter-gigabyte cache on a half-gigabyte instance,
      # next to the workers, is not a cache — it is the reason there was no
      # memory left for one of them.
      - key: CACHE_MAX_BYTES
        value: '67108864'

      # Which origins may call this directly. Navigate reaches the engine from
      # its server, so this is only for the browser-side wheel if that ever
      # happens. Left to be set at deploy time rather than guessed here.
      - key: CORS_ORIGINS
        sync: false

      # Required, and the service refuses to start without it:
      #
      #   Refusing to start: NODE_ENV=production with an empty API_KEYS would
      #   serve every endpoint to anyone who can reach this host.
      #
      # Which is the right behaviour and caught a real omission — the first
      # version of this blueprint declared it for the interpreter and forgot
      # it here, and the engine said so instead of coming up open.
      - key: API_KEYS
        sync: false
