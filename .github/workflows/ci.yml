name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 7.2 MB: 1800-2399 CE for the charts, plus the edges of the measured
  # coverage. `core` was cheaper but left the coverage suite unable to reach
  # the bounds it exists to verify — the manifest's central claim, unchecked.
  EPHEMERIS_PROFILE: bounds
  # Job-wide on purpose. Attached to a single step, it silently missed
  # `pnpm test`, whose contract suite then fell back to a developer's home
  # directory, found nothing, and let Swiss Ephemeris drop to the Moshier
  # model. Every step that touches the ephemeris needs this, so no step
  # declares it.
  SE_EPHE_PATH: ./ephem

jobs:
  # Fails the build if anyone commits ephemeris data. The prototype carried
  # 301 MB of .se1 files un-ignored for 20 months and sisco128/meteorite has
  # ~117 MB permanently in its history — a .gitignore line demonstrably is not
  # enough on its own.
  no-large-blobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject .se1 files and blobs over 5 MB
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=$(git rev-list --max-parents=0 HEAD | tail -1)
          fi

          added=$(git diff --name-only --diff-filter=A "$base" HEAD || true)
          [ -z "$added" ] && { echo "no added files"; exit 0; }

          status=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              *.se1)
                echo "::error file=$file::Ephemeris data must never be committed. Use pnpm ephem:fetch."
                status=1
                continue
                ;;
            esac
            size=$(git cat-file -s "$(git rev-parse "HEAD:$file")" 2>/dev/null || echo 0)
            if [ "$size" -gt 5242880 ]; then
              echo "::error file=$file::Blob is $size bytes, over the 5 MB limit."
              status=1
            fi
          done <<< "$added"
          exit $status

  quality:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is arm64 — the dev machine. Running both proves the
        # prebuilt N-API binary story on the deploy target and locally, and
        # that nothing ever invokes node-gyp.
        os: [ubuntu-latest, macos-14]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # First assertion of the run. `sweph` is N-API and ships prebuilds, so a
      # silent swap to a different build — or a compiler being invoked at all —
      # fails here rather than surfacing as wrong numbers later.
      - name: Assert the binding identity
        run: |
          version=$(node -e "process.stdout.write(require('sweph').version())")
          echo "Swiss Ephemeris: $version"
          [ "$version" = "2.10.03" ] || { echo "::error::expected 2.10.03, got $version"; exit 1; }

      - run: pnpm typecheck
      - run: pnpm lint

      # Not redundant with typecheck: `pnpm build` ran through a tsconfig that
      # did not exist for this project's entire early history, and nobody
      # noticed because dev and tests go through tsx. Compiling is the only
      # step that can catch that class of breakage.
      - run: pnpm build

      - name: Restore ephemeris cache
        id: ephem-cache
        uses: actions/cache@v4
        with:
          path: ephem
          key: ephem-${{ env.EPHEMERIS_PROFILE }}-${{ hashFiles('ephemeris.manifest.json') }}

      - run: pnpm ephem:fetch
      - run: pnpm ephem:verify

      - name: Reject a corrupted ephemeris file
        shell: bash
        run: |
          # verify must FAIL on damaged data. A verifier that cannot fail is
          # not a verifier — and this is exactly the check the prototype's
          # fs.existsSync could not perform.
          cp ephem/seas_18.se1 /tmp/seas.bak
          node -e "const fs=require('fs');const b=fs.readFileSync('ephem/seas_18.se1');fs.writeFileSync('ephem/seas_18.se1',b.subarray(0,b.length-64))"
          if pnpm ephem:verify > /dev/null 2>&1; then
            echo "::error::ephem:verify passed on a truncated file"
            cp /tmp/seas.bak ephem/seas_18.se1
            exit 1
          fi
          cp /tmp/seas.bak ephem/seas_18.se1
          echo "ok: verify rejected the corrupted file"

      # Compiling proved dist exists; this proves it runs. `node dist/main.js`
      # is what production executes, and nothing else on this workflow — or in
      # local dev, which goes through tsx — ever invokes it. Placed after the
      # ephemeris steps so the boot uses the files they already fetched.
      # /v1/ready, not just /v1/health: ready turns 200 only once the ephemeris
      # loaded, the probe passed and a forked dist/pool/worker.js reported in,
      # so it also proves the pool resolved its compiled worker path — the one
      # thing about this build that no amount of type-checking can confirm.
      - name: Smoke-boot the build
        shell: bash
        run: |
          # POOL_SIZE=1 because readiness needs a worker to report in, not a
          # pool. Logs go to a file, not the step's stdout: a background
          # process holding the runner's pipe open is a known way to hang a
          # job, and a boot that never becomes ready has to be able to say why.
          PORT=3199 LOG_LEVEL=info POOL_SIZE=1 node dist/main.js > /tmp/dist-boot.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT

          ready=""
          for _ in $(seq 1 60); do
            if curl -sf -o /tmp/ready.json http://127.0.0.1:3199/v1/ready; then
              ready=yes
              break
            fi
            sleep 0.5
          done

          if [ -z "$ready" ]; then
            echo "::error::node dist/main.js never reported ready within 30s"
            cat /tmp/dist-boot.log
            exit 1
          fi

          curl -sf http://127.0.0.1:3199/v1/health
          echo ""
          cat /tmp/ready.json
          echo ""

      - run: pnpm test
      - run: pnpm test:golden
